name: Daily Pipeline

on:
  schedule:
    - cron: "0 0,4,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.deepseek.com' }}
  LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-v4-flash' }}
  FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pipeline
        run: uv run python -m src.main run

      - name: Commit and push reports
        run: |
          git config user.name "horizon-bot"
          git config user.email "bot@horizon-ai-news.local"
          git add data/
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "📊 daily report $(date +%Y-%m-%d)"
            git push
          fi
